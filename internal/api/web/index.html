<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freizone server</title>
<style>
  :root {
    --bg: #f4f6f6;
    --card: #ffffff;
    --ink: #10201d;
    --muted: #5a6b67;
    --line: #dde5e3;
    --accent: #0c8577;
    --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(16, 32, 29, .06), 0 12px 32px rgba(16, 32, 29, .08);
    /* Tint and weight lifted verbatim from the app's chat background
       (PatternBackground in freizone-app), so the two read as the same
       surface rather than merely similar ones. */
    --pattern-tint: rgba(0, 42, 38, .06);
    /* The constellation has to sit above the pattern but well below the
       text. These three are the dials to turn if it ever reads too loud. */
    --net-edge: rgba(12, 133, 119, .2);
    --net-node: rgba(12, 133, 119, .42);
    --net-pulse: rgba(12, 133, 119, .62);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1513;
      --card: #14201d;
      --ink: #e8efed;
      --muted: #9fb2ad;
      --line: #21322e;
      --accent: #3fbfad;
      --accent-ink: #06201c;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px rgba(0, 0, 0, .35);
      --pattern-tint: rgba(218, 242, 239, .1);
      --net-edge: rgba(63, 191, 173, .22);
      --net-node: rgba(63, 191, 173, .45);
      --net-pulse: rgba(63, 191, 173, .66);
    }
  }

     megabyte on a page that is otherwise 21 KB. Anything crossing a tile edge

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  /* Both decoration layers sit behind the text and swallow no clicks, so
     selection and the footer link behave exactly as before. Deliberately not
     negative z-index: that gets entangled with the way a body background
     propagates to the viewport canvas, whereas lifting main to 1 behaves the
     same everywhere. */
  .pattern, #net {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  /* Same construction as the app: a flat tint showing through a line-art
     mask, not a coloured image. That is what lets one asset serve both
     themes -- only the tint swaps. Guarded because without mask support the
     tint would otherwise flood the page as a solid block. */
  @supports (mask-image: none) or (-webkit-mask-image: none) {
    .pattern {
      background-color: var(--pattern-tint);
      -webkit-mask-image: var(--pattern-mask);
              mask-image: var(--pattern-mask);
      -webkit-mask-repeat: repeat;
              mask-repeat: repeat;
      -webkit-mask-size: 440px 440px;
              mask-size: 440px 440px;
    }
  }
  main {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 30rem;
    text-align: center;
  }
  .logo {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    display: block;
  }
  h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .tagline {
    margin: 6px 0 28px;
    color: var(--muted);
    font-size: 1.02rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 22px 24px;
    text-align: left;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .02em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .badge::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  dl {
    margin: 16px 0 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 16px;
    font-size: .95rem;
  }
  dt { color: var(--muted); }
  dd {
    margin: 0;
    text-align: right;
    font-weight: 600;
    overflow-wrap: anywhere;
  }
  /* Verified-operator checkmark (SRV-19 attestation). Sized off the
     surrounding text so it stays proportionate wherever it is dropped —
     inline at the end of this line, or as icon decoration in the app. */
  .verified-badge {
    width: 1em;
    height: 1em;
    margin-left: .3em;
    vertical-align: -0.15em;
  }
  .hint {
    margin: 24px 0 0;
    color: var(--muted);
    font-size: .92rem;
  }
  .hint code {
    background: var(--line);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: .88em;
  }
  footer {
    margin-top: 22px;
    font-size: .85rem;
    color: var(--muted);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 3px;
  }
</style>
</head>

<script>
  // Reflects no request input; the only dynamic data is this same-origin
  // read of the public server-status endpoint, written via textContent
  // (never innerHTML), so there is no injection surface.
  document.getElementById('host').textContent = location.host;

  var labels = {
    open: 'Open — anyone can register',
    invite: 'Invite only',
    closed: 'Closed'
  };

  // Tier labels shown when an attestation is present (SRV-19). A tier this
  // page does not recognise still shows the neutral fallback rather than
  // nothing -- an older page must not contradict a newer server about the
  // same attestation, which is what silently showing nothing would do.
  var tierLabels = {
    community: 'Verified community server',
    commercial: 'Licensed operator'
  };

  // Verified-operator checkmark, inlined as base64 so this page stays a
  // single file with no second asset to fetch. An 8-lobe seal in the
  // page's own accent colour around a plain checkmark -- the same shape
  // families used, kept simple enough to still read at ~14px. Carries its

      if (still()) render();
    });

    return {
      apply: function (s) {
        state.claimed = s.claimed;
        state.federation = s.federation;
        state.policy = s.policy;
        if (still()) render();
      }
    };
  })();

  fetch('/v1/server-status', { headers: { accept: 'application/json' } })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (s) {
      // Same three facts the rows below spell out, handed to the background
      // so it can say them a second way.
      constellation.apply({
        claimed: !!s.claimed,
        federation: !!s.federation_enabled,
        policy: s.registration_policy
      });

      document.getElementById('federation').textContent = s.federation_enabled ? 'On' : 'Off';
      var el = document.getElementById('registration');
      if (!s.claimed) {
        el.textContent = 'Not set up yet';
      } else {
        el.textContent = labels[s.registration_policy] || s.registration_policy;
      }

      if (s.attestation) {
        var a = parseAttestation(s.attestation);
        if (a) {
          var label = tierLabels[a.tier] || 'Registered operator';
          var value = document.getElementById('attestation-value');
          // Cleared, then rebuilt as text + badge nodes -- a checkmark icon
          // isn't something textContent can carry alongside the label text.
          value.textContent = '';
          value.appendChild(document.createTextNode(a.subject ? label + ' — ' + a.subject : label));
          var badge = document.createElement('img');
          // Inline data URL by design: the whole page is one file, so the
          // badge must not pull in a second asset.
          badge.src = 'data:image/svg+xml;base64,' + VERIFIED_BADGE_SVG_B64;
          badge.alt = 'Verified';
          badge.className = 'verified-badge';
          value.appendChild(badge);
          value.title = 'Attested by the Freizone project. This says nothing about ' +
            'message security, which is identical on every Freizone server.';
          document.getElementById('attestation-label').hidden = false;
          value.hidden = false;
        }
      }
    })
    .catch(function () {
      document.getElementById('registration').textContent = 'unavailable';
      document.getElementById('federation').textContent = 'unavailable';
      // The constellation is deliberately left alone here. Its defaults are
      // the understated ones -- no peers past the frame, nobody joining --
      // and if we could not read the server's own status, claiming either is
      // exactly what we must not do.
    });
</script>
</body>
</html>
